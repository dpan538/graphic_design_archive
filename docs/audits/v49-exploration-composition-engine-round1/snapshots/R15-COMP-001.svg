<svg xmlns="http://www.w3.org/2000/svg" width="720" height="540" viewBox="0 0 720 540" role="img" aria-labelledby="title desc" data-internal-research-only="true"><title id="title">R15-IMAGE-001 internal composition research view</title><desc id="desc">Undirected generic associations with equal-size nodes and equal-width lines. Geometry, split, pruning, and gaps are not historical facts.</desc><rect width="720" height="540" fill="#fffdf8"/><text x="24" y="26" font-family="system-ui,sans-serif" font-size="14" font-weight="600" fill="#27313a">LINEAR_PATH · internal research only</text><text x="24" y="44" font-family="system-ui,sans-serif" font-size="10" fill="#5b6268">Equal node size · equal line width · no arrowheads · circular placement is cosmetic</text><g data-association-id="R14-ASSOC-001" data-support-class="EXTERNALLY_SUPPORTED"><line x1="227" y1="100" x2="491" y2="438" stroke="#4d5964" stroke-width="2"/><title>Qualified generic association; EXTERNALLY_SUPPORTED. No direction or typed relation.</title></g><g data-node-id="institutionalization" data-layout-role="PEER"><circle cx="227" cy="100" r="16" fill="#f7f4ec" stroke="#27313a" stroke-width="1.5"/><text x="227" y="129" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#27313a">institutionalization</text></g><g data-node-id="professionalization" data-layout-role="SEED"><circle cx="491" cy="438" r="16" fill="#f7f4ec" stroke="#27313a" stroke-width="1.5"/><text x="491" y="467" text-anchor="middle" font-family="system-ui,sans-serif" font-size="11" fill="#27313a">professionalization</text></g><text x="696" y="522" text-anchor="end" font-family="system-ui,sans-serif" font-size="9" fill="#737a80">association ≠ typed historical relation</text></svg>
